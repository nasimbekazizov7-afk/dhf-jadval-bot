name: Botga javob (tinglash)
on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tg-poll
  cancel-in-progress: false
jobs:
  tinglash:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Boshlanish vaqti
        run: date +%s > /tmp/boshlanish
      - name: Tinglash va eslatmalar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py loop 330
      - name: Holatni saqlash
        if: always()
        run: |
          if [ -n "$(git status --porcelain .state)" ]; then
            git config user.name "dhf-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .state
            git commit -m "holat: $(date -u +%F_%H-%M)"
            git pull --rebase --autostash || true
            git push || true
          else
            echo "uzgarish yuq"
          fi
      - name: Keyingi seansni boshlash
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then echo "GH_PAT yo'q — zanjir to'xtadi"; exit 0; fi
          S=$(cat /tmp/boshlanish 2>/dev/null || echo 0); N=$(date +%s); D=$(( N - S ))
          if [ "$D" -lt 1800 ]; then echo "juda tez tugadi, $(( 1800 - D )) s kutamiz"; sleep $(( 1800 - D )); fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/javob.yml/dispatches \
            -d '{"ref":"main"}'
          echo "keyingi seans chaqirildi"
