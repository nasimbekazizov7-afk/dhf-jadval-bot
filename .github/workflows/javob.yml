name: Botga javob (tinglash)

on:
  schedule:
    # Соат бошидан узоқ вақтлар: соатига 3 марта, ҳар 20 дақиқада
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

concurrency:
  group: tg-poll
  cancel-in-progress: true

jobs:
  tinglash:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Foydalanuvchilarga javob berish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py javob 330
