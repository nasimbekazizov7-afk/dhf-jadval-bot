name: PAT sinovi
on:
  workflow_dispatch:
jobs:
  sinov:
    runs-on: ubuntu-latest
    steps:
      - name: PAT bilan javob.yml ni chaqirish
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then echo "NATIJA: GH_PAT bo'sh"; exit 1; fi
          echo "GH_PAT uzunligi: ${#GH_PAT}"
          CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/javob.yml/dispatches \
            -d '{"ref":"main"}')
          echo "HTTP: $CODE"
          cat /tmp/resp.txt
          if [ "$CODE" = "204" ]; then echo "NATIJA: ZANJIR ISHLAYDI"; else echo "NATIJA: XATO"; exit 1; fi
