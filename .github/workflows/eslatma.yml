name: ДҲФ дарс эслатмалари

on:
  schedule:
    # Вақтлар UTC да. Тошкент = UTC+5.
    - cron: "0 13 * * *"      # 18:00 Тошкент — эртанги машғулотлар рўйхати
    - cron: "40 3 * * 1-5"    # 08:40 Тошкент — 9:00 даги дарс учун (08:50 да юборилади)
    - cron: "10 5 * * 1-5"    # 10:10 Тошкент — 10:30 даги дарс учун (10:20 да юборилади)
    - cron: "40 6 * * 1-5"    # 11:40 Тошкент — 12:00 даги дарс учун (11:50 да юборилади)
  workflow_dispatch:
    inputs:
      buyruq:
        description: "digest | remind 9:00 | remind 10:30 | remind 12:00 | test"
        required: true
        default: "test"

jobs:
  xabar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Хабарни юбориш
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.buyruq }}
        run: |
          if [ -n "$MANUAL" ]; then
            python bot.py $MANUAL
          else
            case "$CRON" in
              "0 13 * * *")   python bot.py digest ;;
              "40 3 * * 1-5") python bot.py remind 9:00 ;;
              "10 5 * * 1-5") python bot.py remind 10:30 ;;
              "40 6 * * 1-5") python bot.py remind 12:00 ;;
              *) echo "номаълум жадвал: $CRON" ;;
            esac
          fi
