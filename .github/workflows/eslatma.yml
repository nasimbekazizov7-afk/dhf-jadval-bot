name: ДҲФ дарс эслатмалари

on:
  schedule:
    # UTC. Тошкент = UTC+5. Соат бошидан узоқ, дарсга яқин вақтлар.
    - cron: "7 13 * * *"      # 18:07 — эртанги машғулотлар рўйхати
    - cron: "37 13 * * *"     # 18:37 — заҳира
    - cron: "47 3 * * 1-5"    # 08:47 — 9:00 даги дарс
    - cron: "54 3 * * 1-5"    # 08:54 — заҳира
    - cron: "17 5 * * 1-5"    # 10:17 — 10:30 даги дарс
    - cron: "24 5 * * 1-5"    # 10:24 — заҳира
    - cron: "47 6 * * 1-5"    # 11:47 — 12:00 даги дарс
    - cron: "54 6 * * 1-5"    # 11:54 — заҳира
  workflow_dispatch:
    inputs:
      buyruq:
        description: "digest | remind 9:00 | remind 10:30 | remind 12:00 | test | diag"
        required: true
        default: "test"

permissions:
  contents: write

jobs:
  xabar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Хабарни юбориш
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRON: ${{ github.event.schedule }}
          MANUAL: ${{ github.event.inputs.buyruq }}
        run: |
          if [ -n "$MANUAL" ]; then
            python bot.py $MANUAL
          else
            case "$CRON" in
              "7 13 * * *"|"37 13 * * *")     python bot.py digest ;;
              "47 3 * * 1-5"|"54 3 * * 1-5")  python bot.py remind 9:00 ;;
              "17 5 * * 1-5"|"24 5 * * 1-5")  python bot.py remind 10:30 ;;
              "47 6 * * 1-5"|"54 6 * * 1-5")  python bot.py remind 12:00 ;;
              *) echo "номаълум жадвал: $CRON" ;;
            esac
          fi
      - name: Holatni saqlash
        if: always()
        run: |
          if [ -n "$(git status --porcelain .state)" ]; then
            git config user.name "dhf-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .state
            git commit -m "holat: $(date -u +%F_%H-%M)"
            git pull --rebase --autostash || true
            git push
          else
            echo "uzgarish yuq"
          fi
